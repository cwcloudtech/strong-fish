name: strong_fish_mobile
description: "strong-fish: RPE-based powerlifting programs, 1RM-driven loads, clubs and a training feed."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  # Reads the QR code the web app's API-keys screen shows, which is what
  # enrols this device without typing a password.
  mobile_scanner: ^7.4.0
  # The provider embeds a post's video link resolves to (see widgets/media_player.dart).
  webview_flutter: ^4.14.1
  # Downloading and handing a newer APK to Android's package installer.
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo-dark.png
    - assets/images/icon.png
    - assets/images/icon-dark.png

# The launcher icon is generated from the same square crop of the logo the web
# favicon uses (the wordmark is unreadable at icon sizes, so it's cropped out).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"
  remove_alpha_ios: true
