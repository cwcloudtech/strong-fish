# Gradle tuning. This file is used as-is by BOTH local dev and the Dockerfile's
# mobile_build stage (which just `COPY sf-mobile/ ./` — there is no separate
# CI override), so it must stay safe for a memory-constrained build container too.
#
# Sized to fit alongside the IDE and Flutter's Dart/AOT compiler on a ~16GB
# machine. Flutter's stock -Xmx8G + -XX:MaxMetaspaceSize=4G could reserve ~12GB
# for Gradle alone and thrash into swap (slow *and* RAM-hungry). Metaspace never
# needs anywhere near 4G for this app.
#
# After editing, run `./gradlew --stop` (in this android/ dir): a daemon already
# started with the old heap lingers ~3h holding that memory, which makes it look
# like this file "isn't used". Verify the value in effect with:
#   ./gradlew --stop && ./gradlew -q help --info 2>&1 | grep -i "Xmx"
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Reuse a warm daemon and cache task outputs across builds (much faster locally).
# Parallel is left off: a Flutter app is effectively single-module, so it buys
# little and each extra worker is another JVM competing for the same RAM.
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=false

# Cap the Kotlin compile daemon too (it forks its own JVM).
kotlin.daemon.jvm.options=-Xmx1G

# Bound the worker JVM pool so a many-core CI runner doesn't spin up one 2G worker
# per core alongside the native Dart AOT (gen_snapshot) processes and blow the
# container's memory budget. Two is plenty for an effectively single-module app.
org.gradle.workers.max=1

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
