server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's directory redirect ("/docs" -> "/docs/") is absolute by default
    # and rebuilds the URL from server_name, dropping the port and any scheme
    # the proxy in front terminated. Relative redirects keep whatever the
    # client actually asked for, which is the only thing that works both
    # behind a TLS proxy and on a mapped port locally.
    absolute_redirect off;

    # Single-page app: every unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.apk$ {
        add_header Content-Type application/vnd.android.package-archive;
    }
}
